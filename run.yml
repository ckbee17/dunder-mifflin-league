name: Dunder Mifflin League — trading round

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"   # hourly backstop, in case a run ever dies unexpectedly

permissions:
  contents: write

# Never run two loops at once; a backstop trigger just waits.
concurrency:
  group: trading-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # GitHub caps jobs at 6h; we loop for 5h then hand off
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Trade a round every 15 minutes for ~5 hours
        run: |
          git config user.name  "dunder-mifflin-bot"
          git config user.email "actions@users.noreply.github.com"
          END=$(( $(date +%s) + 18000 ))     # ~5 hours from now
          while [ "$(date +%s)" -lt "$END" ]; do
            node run.cjs || echo "round hiccup — will retry next cycle"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "trading round $(date -u +'%Y-%m-%d %H:%M UTC')"
              git pull --rebase --autostash || true
              git push || true
            fi
            sleep 900                          # 15 minutes
          done

      - name: Hand off to the next run (self-perpetuating)
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.RUNNER_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches" \
            -d '{"ref":"main"}'
